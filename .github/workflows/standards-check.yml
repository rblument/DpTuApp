name: Standards Check

permissions:
  contents: read
  pull-requests: write
  issues: write

# This workflow enforces DpTu coding standards:
#
# Job 1 – logging-standards (enforces the DpTu Logging Developer Guide)
#   Goals:
#   1) FAIL the build on forbidden logging patterns that bypass SLF4J
#   2) WARN (non-blocking) on files that appear to have no logging at all
#
#   Rationale:
#   - Application code must use SLF4J (org.slf4j.Logger) exclusively
#   - Direct console output, stack trace printing, JUL imports, or direct
#     backend usage (Log4j2) are not allowed in new code
#   - Some checks are warnings to avoid breaking legacy code while still
#     nudging developers toward the standard
#
# Job 2 – spelling-check (enforces spelling via cspell)
#   Goals:
#   1) FAIL the build on new spelling errors introduced by the PR
#   2) Post / update / delete a sticky PR comment listing violations
#
#   Rationale:
#   - Mis-spelled identifiers, comments, and documentation degrade quality
#   - Only *new* violations (relative to the development baseline) block the
#     build, so pre-existing issues never prevent ongoing work
#   - Add accepted project-specific terms to .cspell/project-words.txt

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches: [ main, development ]
  workflow_dispatch: # allow manual runs

jobs:
  logging-standards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout development baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: development
          path: baseline

      # ------------------------------------------------------------------
      # STEP 1: Fail-fast checks for forbidden patterns
      # ------------------------------------------------------------------
      - name: Enforce forbidden logging patterns (ERROR)
        shell: bash
        run: |
          set -euo pipefail

          # Build a concrete list of Java files to scan (non-test sources only).
          # Using an explicit list avoids accidental scanning of resources.
          mapfile -t JAVA_FILES < <(
            find src/ -type f -name '*.java' \
              ! -path '*/test/*' \
              ! -path '*/tests/*' \
              ! -path '*/integrationTest/*' \
              ! -path '*/integrationTests/*' \
              ! -name '*Test.java' \
              ! -name '*Tests.java' \
              ! -name '*IT.java'
          )

          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "ℹ️ No Java source files found to scan."
            exit 0
          fi

          echo "🔍 Enforcing logging standards (errors)..."

          # These patterns indicate logging bypasses or API drift and
          # MUST fail the build if detected anywhere in src/.
          #
          # Notes:
          # - System.out / System.err bypass the logging framework entirely
          # - printStackTrace() loses structure and routing
          # - Direct JUL or Log4j2 usage violates the SLF4J-only rule
          ERROR_PATTERNS=(
            # Console output (stdout)
            "System\\.out\\.(print|println|printf|append)"

            # Console output (stderr)
            "System\\.err\\.(print|println|printf)"

            # Any Throwable/Exception stack trace printing
            "\\.printStackTrace\\s*\\("

            # Direct JUL imports or logger creation
            "import java\\.util\\.logging\\."
            "java\\.util\\.logging\\.Logger\\.getLogger"

            # Direct Log4j / Log4j2 usage in application code
            "import org\\.apache\\.logging\\.log4j"
            "LogManager\\.getLogger"

            # Abrupt JVM termination (bypasses shutdown logging)
            "System\\.exit\\s*\\("
          )

          FAILED=0

          for pattern in "${ERROR_PATTERNS[@]}"; do
            echo "Checking ERROR pattern: $pattern"
            if grep -nE "$pattern" "${JAVA_FILES[@]}"; then
              echo "❌ Forbidden pattern detected: $pattern"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo
            echo "🚨 Logging standards violation found."
            echo "Refer to the DpTu Logging Developer Guide for correct usage."
            exit 1
          fi

          echo "✅ No forbidden logging patterns found."

      # ------------------------------------------------------------------
      # STEP 2: Advisory checks (warnings only)
      # ------------------------------------------------------------------
      - name: Advisory logging checks (WARN)
        shell: bash
        run: |
          set -euo pipefail

          # Build a concrete list of Java files to scan (non-test sources only).
          # Using an explicit list avoids accidental scanning of resources.
          mapfile -t JAVA_FILES < <(
            find src/ -type f -name '*.java' \
              ! -path '*/test/*' \
              ! -path '*/tests/*' \
              ! -path '*/integrationTest/*' \
              ! -path '*/integrationTests/*' \
              ! -name '*Test.java' \
              ! -name '*Tests.java' \
              ! -name '*IT.java'
          )

          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "ℹ️ No Java source files found to scan."
            exit 0
          fi

          echo "⚠️ Running advisory logging checks (warnings only)..."

          # --------------------------------------------------------------
          # SANITY: identify file kinds that generally should not need logging
          # (enums, interfaces, annotations, records). These are exempt from
          # "missing logger" / "unused logger" warnings by default.
          # --------------------------------------------------------------

          # Top-level enum/interface/@interface/record declarations (heuristic: starts at line beginning)
          ENUM_FILES=$(
            grep -lE '^\s*(public\s+)?enum\s+[A-Za-z_][A-Za-z0-9_]*\b' "${JAVA_FILES[@]}" || true
          )
          INTERFACE_FILES=$(
            grep -lE '^\s*(public\s+)?interface\s+[A-Za-z_][A-Za-z0-9_]*\b' "${JAVA_FILES[@]}" || true
          )
          ANNOTATION_FILES=$(
            grep -lE '^\s*(public\s+)?@interface\s+[A-Za-z_][A-Za-z0-9_]*\b' "${JAVA_FILES[@]}" || true
          )
          RECORD_FILES=$(
            grep -lE '^\s*(public\s+)?record\s+[A-Za-z_][A-Za-z0-9_]*\b' "${JAVA_FILES[@]}" || true
          )

          # Union of exempt files (sorted unique)
          EXEMPT_FILES=$(
            { printf "%s\n" $ENUM_FILES $INTERFACE_FILES $ANNOTATION_FILES $RECORD_FILES 2>/dev/null || true; } | \
              sed '/^\s*$/d' | sort -u
          )

          # Files that explicitly suppress logging warnings
          LOGGING_SUPPRESSED_FILES=$(
            grep -l '@SuppressWarnings("Logging")' "${JAVA_FILES[@]}" || true
          )

          # --------------------------------------------------------------
          # SANITY: suppressions should only be used on exempt kinds.
          # If a file suppresses Logging but is NOT exempt, warn on it.
          # --------------------------------------------------------------
          BAD_SUPPRESS_FILES=""
          if [ -n "${LOGGING_SUPPRESSED_FILES:-}" ]; then
            BAD_SUPPRESS_FILES=$(
              comm -23 \
                <(printf "%s\n" $LOGGING_SUPPRESSED_FILES | sort -u) \
                <(printf "%s\n" $EXEMPT_FILES | sort -u) || true
            )
          fi

          # --------------------------------------------------------------
          # WARN 1: Missing or unused SLF4J logging (excluding exempt kinds)
          #
          # Escape hatch:
          #   @SuppressWarnings("Logging")
          #
          # Suppresses WARN-only findings, never ERRORs
          # --------------------------------------------------------------

          # Files with no SLF4J Logger import at all
          NO_LOG_IMPORT_FILES=$(
            grep -LE "org.slf4j.Logger" "${JAVA_FILES[@]}" || true
          )

          # Files that import SLF4J Logger but never use it
          UNUSED_LOGGER_FILES=$(
            grep -l "org.slf4j.Logger" "${JAVA_FILES[@]}" | \
            xargs -r grep -EL "log\.(trace|debug|info|warn|error)\s*\("
          )

          # Helper: remove suppressed files from a list
          filter_suppressed() {
            local files="$1"
            if [ -n "$files" ] && [ -n "${LOGGING_SUPPRESSED_FILES:-}" ]; then
              comm -23 \
                <(printf "%s\n" $files | sort -u) \
                <(printf "%s\n" $LOGGING_SUPPRESSED_FILES | sort -u)
            else
              printf "%s\n" $files | sed '/^\s*$/d' || true
            fi
          }

          # Helper: remove exempt files from a list
          filter_exempt() {
            local files="$1"
            if [ -n "$files" ] && [ -n "${EXEMPT_FILES:-}" ]; then
              comm -23 \
                <(printf "%s\n" $files | sort -u) \
                <(printf "%s\n" $EXEMPT_FILES | sort -u)
            else
              printf "%s\n" $files | sed '/^\s*$/d' || true
            fi
          }

          # Apply filters: first remove suppressed, then remove exempt (or vice versa)
          NO_LOG_IMPORT_FILES=$(filter_exempt "$(filter_suppressed "$NO_LOG_IMPORT_FILES")")
          UNUSED_LOGGER_FILES=$(filter_exempt "$(filter_suppressed "$UNUSED_LOGGER_FILES")")

          if [ -n "$NO_LOG_IMPORT_FILES" ] || [ -n "$UNUSED_LOGGER_FILES" ] || [ -n "$BAD_SUPPRESS_FILES" ]; then
            echo
            echo "⚠️ Advisory logging findings:"

            if [ -n "$NO_LOG_IMPORT_FILES" ]; then
              echo
              echo "--- No SLF4J Logger import detected (non-exempt, non-suppressed) ---"
              echo "$NO_LOG_IMPORT_FILES"
            fi

            if [ -n "$UNUSED_LOGGER_FILES" ]; then
              echo
              echo "--- SLF4J Logger imported but never used (non-exempt, non-suppressed) ---"
              echo "$UNUSED_LOGGER_FILES"
            fi

            if [ -n "$BAD_SUPPRESS_FILES" ]; then
              echo
              echo "--- Suppressed files that do NOT pass sanity checks ---"
              echo "$BAD_SUPPRESS_FILES"
              echo
              echo "Guidance: Only suppress @SuppressWarnings(\"Logging\") on enums/interfaces/annotations/records."
              echo "If a class truly should not log, refactor to an exempt kind or add a short note explaining why and log minimally where behavior exists."
            fi

            echo
            echo "Guidance: Add logging, or suppress only when the file is an exempt kind."
          else
            echo "✅ All Java files appear to use SLF4J logging correctly (with sanity exemptions applied)."
          fi

          # --------------------------------------------------------------
          # WARN 2: Empty catch blocks
          # --------------------------------------------------------------
          if grep -nE "catch\s*\([^)]*\)\s*\{\s*\}" "${JAVA_FILES[@]}"; then
            echo
            echo "⚠️ Empty catch blocks detected. Consider logging the exception."
          else
            echo "✅ No empty catch blocks detected."
          fi

          # --------------------------------------------------------------
          # WARN 3: log.error calls without exception parameter
          # --------------------------------------------------------------
          if grep -nE "log\.error\s*\([^,)]*\)" "${JAVA_FILES[@]}"; then
            echo
            echo "⚠️ log.error calls without exception context detected."
            echo "Guidance: Prefer log.error(\"message\", exception)."
          else
            echo "✅ All log.error calls appear to include exception context."
          fi

          echo
          echo "ℹ️ Advisory checks complete. Warnings do not fail the build."

      - name: Compare logging violations to development
        if: always() && github.event_name == 'pull_request'
        id: logging_delta
        shell: bash
        run: |
          set -euo pipefail

          collect_java_files() {
            local root="$1"
            find "$root/src" -type f -name '*.java' \
              ! -path '*/test/*' \
              ! -path '*/tests/*' \
              ! -path '*/integrationTest/*' \
              ! -path '*/integrationTests/*' \
              ! -name '*Test.java' \
              ! -name '*Tests.java' \
              ! -name '*IT.java'
          }

          collect_violations() {
            local root="$1"
            local out="$2"
            : > "$out"

            mapfile -t files < <(collect_java_files "$root")
            if [ "${#files[@]}" -eq 0 ]; then
              return 0
            fi

            # Error patterns
            local ERROR_PATTERNS=(
              "System\\.out\\.(print|println|printf|append)"
              "System\\.err\\.(print|println|printf)"
              "\\.printStackTrace\\s*\\("
              "import java\\.util\\.logging\\."
              "java\\.util\\.logging\\.Logger\\.getLogger"
              "import org\\.apache\\.logging\\.log4j"
              "LogManager\\.getLogger"
              "System\\.exit\\s*\\("
            )

            for pattern in "${ERROR_PATTERNS[@]}"; do
              grep -nH -E "$pattern" "${files[@]}" | sed "s#^#ERROR|$pattern|#" >> "$out" || true
            done

            local enum_files interface_files annotation_files record_files exempt_files suppressed_files
            enum_files=$(grep -lE '^\s*(public\s+)?enum\s+[A-Za-z_][A-Za-z0-9_]*\b' "${files[@]}" || true)
            interface_files=$(grep -lE '^\s*(public\s+)?interface\s+[A-Za-z_][A-Za-z0-9_]*\b' "${files[@]}" || true)
            annotation_files=$(grep -lE '^\s*(public\s+)?@interface\s+[A-Za-z_][A-Za-z0-9_]*\b' "${files[@]}" || true)
            record_files=$(grep -lE '^\s*(public\s+)?record\s+[A-Za-z_][A-Za-z0-9_]*\b' "${files[@]}" || true)
            exempt_files=$({ printf "%s\n" $enum_files $interface_files $annotation_files $record_files 2>/dev/null || true; } | sed '/^\s*$/d' | sort -u)
            suppressed_files=$(grep -l '@SuppressWarnings("Logging")' "${files[@]}" || true)

            filter_suppressed() {
              local list="$1"
              if [ -n "$list" ] && [ -n "${suppressed_files:-}" ]; then
                comm -23 \
                  <(printf "%s\n" $list | sort -u) \
                  <(printf "%s\n" $suppressed_files | sort -u)
              else
                printf "%s\n" $list | sed '/^\s*$/d' || true
              fi
            }

            filter_exempt() {
              local list="$1"
              if [ -n "$list" ] && [ -n "${exempt_files:-}" ]; then
                comm -23 \
                  <(printf "%s\n" $list | sort -u) \
                  <(printf "%s\n" $exempt_files | sort -u)
              else
                printf "%s\n" $list | sed '/^\s*$/d' || true
              fi
            }

            local no_log_import unused_logger bad_suppress
            no_log_import=$(grep -LE "org.slf4j.Logger" "${files[@]}" || true)
            unused_logger=$(grep -l "org.slf4j.Logger" "${files[@]}" | xargs -r grep -EL "log\.(trace|debug|info|warn|error)\s*\(" || true)

            no_log_import=$(filter_exempt "$(filter_suppressed "$no_log_import")")
            unused_logger=$(filter_exempt "$(filter_suppressed "$unused_logger")")

            if [ -n "${suppressed_files:-}" ]; then
              bad_suppress=$(comm -23 \
                <(printf "%s\n" $suppressed_files | sort -u) \
                <(printf "%s\n" $exempt_files | sort -u) || true)
            else
              bad_suppress=""
            fi

            [ -n "$no_log_import" ] && printf "%s\n" $no_log_import | sed 's#^#WARN|NO_LOG_IMPORT|#' >> "$out"
            [ -n "$unused_logger" ] && printf "%s\n" $unused_logger | sed 's#^#WARN|UNUSED_LOGGER|#' >> "$out"
            [ -n "$bad_suppress" ] && printf "%s\n" $bad_suppress | sed 's#^#WARN|BAD_SUPPRESS|#' >> "$out"

            grep -nH -E "catch\s*\([^)]*\)\s*\{\s*\}" "${files[@]}" | sed 's#^#WARN|EMPTY_CATCH|#' >> "$out" || true
            grep -nH -E "log\.error\s*\([^,)]*\)" "${files[@]}" | sed 's#^#WARN|ERROR_NO_EXCEPTION|#' >> "$out" || true

            sort -u "$out" -o "$out"
          }

          collect_violations "." current_violations.txt
          collect_violations "baseline" base_violations.txt

          # Normalize file prefixes so baseline and current findings compare on the
          # same relative path shape (e.g., src/... instead of baseline/src/...).
          sed -E 's#\|baseline/src/#|src/#g; s#\|\./src/#|src/#g; s#\|src/#|src/#g' current_violations.txt > current_violations.normalized.txt
          sed -E 's#\|baseline/src/#|src/#g; s#\|\./src/#|src/#g; s#\|src/#|src/#g' base_violations.txt > base_violations.normalized.txt

          comm -13 base_violations.normalized.txt current_violations.normalized.txt > new_violations.txt || true
          count=$(grep -c '.' new_violations.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "<!-- logging-violations-delta -->"
            echo "## Logging Violations Delta"
            echo
            echo "_This comment updates with future commits to this branch and is removed when there are no remaining logging issues to report._"
            echo
            if [ "$count" -eq 0 ]; then
              echo "No new logging workflow violations were introduced compared to \`development\`."
            else
              echo "This PR introduces **$count** new logging workflow violation(s) compared to \`development\`."
              echo
              echo "| Type | Details |"
              echo "|---|---|"
              head -n 50 new_violations.txt | while IFS='|' read -r severity rule detail; do
                safe_detail=$(printf '%s' "$detail" | sed 's/`/\\`/g')
                safe_rule=$(printf '%s' "$rule" | sed 's/`/\\`/g')
                echo "| $severity / \`$safe_rule\` | \`$safe_detail\` |"
              done
              if [ "$count" -gt 50 ]; then
                echo
                echo "_Showing first 50 violations._"
              fi
            fi
          } > logging_delta_comment.md

      - name: Comment logging violations delta on PR
        if: always() && github.event_name == 'pull_request' && steps.logging_delta.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          NEW_LOGGING_VIOLATIONS: ${{ steps.logging_delta.outputs.count }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- logging-violations-delta -->';
            const body = fs.readFileSync('logging_delta_comment.md', 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Remove stale logging delta comment on PR
        if: always() && github.event_name == 'pull_request' && steps.logging_delta.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- logging-violations-delta -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existing.id,
              });
            }

  # --------------------------------------------------------------------
  # Job 2: Spelling check via cspell
  # --------------------------------------------------------------------
  spelling-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout development baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: development
          path: baseline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cspell
        run: npm install -g cspell@latest

      # ------------------------------------------------------------------
      # On push / workflow_dispatch: just report, never fail
      # ------------------------------------------------------------------
      - name: Run cspell (push / manual)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set +e
          cspell lint --config cspell.config.yaml --no-progress --show-context 2>&1
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "ℹ️ cspell found issues (advisory only on push/manual runs)."
          else
            echo "✅ cspell found no spelling issues."
          fi
          exit 0

      # ------------------------------------------------------------------
      # On PR: delta-based check — only violations NEW to this PR fail
      # ------------------------------------------------------------------
      - name: Run cspell on PR branch
        if: github.event_name == 'pull_request'
        id: cspell_head
        shell: bash
        run: |
          set +e
          cspell lint --config cspell.config.yaml --no-progress 2>&1 \
            | grep -v '^CSpell:' | sort -u > /tmp/cspell_head.txt || true
          head -20 /tmp/cspell_head.txt

      - name: Run cspell on development baseline
        if: github.event_name == 'pull_request'
        id: cspell_base
        shell: bash
        run: |
          set +e
          cspell lint --config baseline/cspell.config.yaml --no-progress \
            --root baseline 2>&1 \
            | grep -v '^CSpell:' | sed 's#^baseline/##g' | sort -u > /tmp/cspell_base.txt || true
          head -20 /tmp/cspell_base.txt

      - name: Compute new spelling violations
        if: github.event_name == 'pull_request'
        id: spelling_delta
        shell: bash
        run: |
          set +e
          comm -13 /tmp/cspell_base.txt /tmp/cspell_head.txt > /tmp/cspell_new.txt 2>&1 || true
          count=$(wc -l < /tmp/cspell_new.txt 2>/dev/null || echo 0)
          # Remove trailing blank lines if any
          count=$(grep -c . /tmp/cspell_new.txt 2>/dev/null || echo 0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          
          echo "ℹ️ Debug info:"
          echo "  Baseline violations: $(wc -l < /tmp/cspell_base.txt)"
          echo "  Head violations: $(wc -l < /tmp/cspell_head.txt)"
          echo "  New violations: $count"

          marker='<!-- cspell-violations-delta -->'
          {
            echo "$marker"
            echo "## Spelling Violations Delta"
            echo
            echo "_This comment updates with each commit to this branch and is removed when all spelling issues are resolved._"
            echo
            if [ "$count" -eq 0 ]; then
              echo "No new spelling violations were introduced compared to \`development\`."
            else
              echo "This PR introduces **$count** new spelling violation(s) compared to \`development\`."
              echo
              echo "To fix: correct the spelling or add accepted project-specific terms to \`.cspell/project-words.txt\`."
              echo
              echo "\`\`\`"
              cat /tmp/cspell_new.txt
              echo "\`\`\`"
            fi
          } > /tmp/cspell_comment.md

      - name: Fail build on new spelling violations
        if: github.event_name == 'pull_request' && steps.spelling_delta.outputs.count != '0'
        shell: bash
        run: |
          echo "🚨 ${{ steps.spelling_delta.outputs.count }} new spelling violation(s) detected."
          echo "See the PR comment for details or run: cspell lint --config cspell.config.yaml"
          exit 1

      - name: Post or update spelling delta comment on PR
        if: always() && github.event_name == 'pull_request' && steps.spelling_delta.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cspell-violations-delta -->';
            const body = fs.readFileSync('/tmp/cspell_comment.md', 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Remove stale spelling delta comment on PR
        if: always() && github.event_name == 'pull_request' && steps.spelling_delta.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cspell-violations-delta -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existing.id,
              });
            }
