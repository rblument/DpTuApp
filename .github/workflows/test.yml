name: Run Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch: #allow manual runs

permissions:
  contents: write
  checks: write
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17 (with Maven cache)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run tests and generate coverage report
      timeout-minutes: 15
      env:
        MAVEN_OPTS: >-
          -Daether.transport.http.connectTimeout=10000
          -Daether.transport.http.requestTimeout=30000
          -Dmaven.wagon.http.retryHandler.count=2
          -Dmaven.wagon.rto=30000
      run: mvn -B --no-transfer-progress verify

    - name: Generate coverage summary snapshot
      shell: bash
      run: |
        python - <<'PY'
        import csv
        import json
        from pathlib import Path

        csv_path = Path('target/site/jacoco/jacoco.csv')
        output_path = Path('.github/badges/coverage-summary.json')
        ui_prefixes = ('edu.regis.dptu.view',)

        if not csv_path.exists():
          raise SystemExit('JaCoCo CSV not found; cannot generate coverage summary snapshot.')

        with csv_path.open(newline='', encoding='utf-8') as f:
          rows = list(csv.DictReader(f))

        def totals(include_ui: bool) -> tuple[int, int]:
          covered = 0
          missed = 0
          for row in rows:
            package_name = row['PACKAGE']
            if not include_ui and package_name.startswith(ui_prefixes):
              continue
            covered += int(row['LINE_COVERED'])
            missed += int(row['LINE_MISSED'])
          return covered, missed

        def percent(covered: int, missed: int) -> float:
          total = covered + missed
          return (100.0 * covered / total) if total else 0.0

        all_covered, all_missed = totals(include_ui=True)
        non_ui_covered, non_ui_missed = totals(include_ui=False)

        output_path.parent.mkdir(parents=True, exist_ok=True)
        with output_path.open('w', encoding='utf-8') as f:
          json.dump(
            {
              'all_classes': {
                'covered': all_covered,
                'missed': all_missed,
                'percent': round(percent(all_covered, all_missed), 3),
              },
              'non_swing_ui_classes': {
                'covered': non_ui_covered,
                'missed': non_ui_missed,
                'percent': round(percent(non_ui_covered, non_ui_missed), 3),
              },
            },
            f,
            indent=2,
          )
          f.write('\n')
        PY

    - name: Checkout development coverage baseline
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v4
      with:
        ref: development
        path: baseline
        fetch-depth: 1
        sparse-checkout: |
          .github/badges/coverage-summary.json
        sparse-checkout-cone-mode: false

    - name: Compare coverage to development
      if: always() && github.event_name == 'pull_request'
      id: coverage_delta
      shell: bash
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        head_summary_path = Path('.github/badges/coverage-summary.json')
        base_summary_path = Path('baseline/.github/badges/coverage-summary.json')

        output_path = Path(os.environ['GITHUB_OUTPUT'])

        if not head_summary_path.exists() or not base_summary_path.exists():
          with output_path.open('a', encoding='utf-8') as out:
            out.write('available=false\n')
            out.write('all_head=0.000\n')
            out.write('all_base=0.000\n')
            out.write('all_delta=0.000\n')
            out.write('non_ui_head=0.000\n')
            out.write('non_ui_base=0.000\n')
            out.write('non_ui_delta=0.000\n')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
            with open(summary_path, 'a', encoding='utf-8') as summary:
              summary.write('\n## Coverage Delta vs development\n')
              summary.write('Coverage comparison unavailable because the stored development coverage summary was missing.\n')
          raise SystemExit(0)

        with head_summary_path.open(encoding='utf-8') as f:
          head_summary = json.load(f)
        with base_summary_path.open(encoding='utf-8') as f:
          base_summary = json.load(f)

        all_head_pct = float(head_summary['all_classes']['percent'])
        all_base_pct = float(base_summary['all_classes']['percent'])
        all_delta = all_head_pct - all_base_pct

        non_ui_head_pct = float(head_summary['non_swing_ui_classes']['percent'])
        non_ui_base_pct = float(base_summary['non_swing_ui_classes']['percent'])
        non_ui_delta = non_ui_head_pct - non_ui_base_pct

        with output_path.open('a', encoding='utf-8') as out:
          out.write('available=true\n')
          out.write(f'all_head={all_head_pct:.3f}\n')
          out.write(f'all_base={all_base_pct:.3f}\n')
          out.write(f'all_delta={all_delta:.3f}\n')
          out.write(f'non_ui_head={non_ui_head_pct:.3f}\n')
          out.write(f'non_ui_base={non_ui_base_pct:.3f}\n')
          out.write(f'non_ui_delta={non_ui_delta:.3f}\n')

        summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
        if summary_path:
          with open(summary_path, 'a', encoding='utf-8') as summary:
            summary.write('\n## Coverage Delta vs development\n')
            summary.write('| Metric | development | PR (current) | Delta |\n')
            summary.write('|---|---:|---:|---:|\n')
            summary.write(f'| All classes | {all_base_pct:.3f}% | {all_head_pct:.3f}% | {all_delta:+.3f}% |\n')
            summary.write(f'| Non-Swing UI classes | {non_ui_base_pct:.3f}% | {non_ui_head_pct:.3f}% | {non_ui_delta:+.3f}% |\n')
        PY

    - name: Enforce minimum coverage (fail fast)
      shell: bash
      run: |
        python - <<'PY'
        import csv
        from pathlib import Path

        threshold = 40.0
        csv_path = Path('target/site/jacoco/jacoco.csv')

        if not csv_path.exists():
          raise SystemExit('JaCoCo CSV not found; cannot enforce minimum coverage threshold.')

        with csv_path.open(newline='', encoding='utf-8') as f:
          rows = list(csv.DictReader(f))

        covered = sum(int(r['LINE_COVERED']) for r in rows)
        missed = sum(int(r['LINE_MISSED']) for r in rows)
        total = covered + missed
        pct = (100.0 * covered / total) if total else 0.0

        print(f'Coverage: {pct:.3f}% (threshold: {threshold:.1f}%)')
        if pct < threshold:
          raise SystemExit(f'Coverage check failed: {pct:.3f}% < {threshold:.1f}%')
        PY

    - name: Comment coverage delta on PR
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        COVERAGE_AVAILABLE: ${{ steps.coverage_delta.outputs.available }}
        ALL_HEAD_COVERAGE: ${{ steps.coverage_delta.outputs.all_head }}
        ALL_BASE_COVERAGE: ${{ steps.coverage_delta.outputs.all_base }}
        ALL_DELTA_COVERAGE: ${{ steps.coverage_delta.outputs.all_delta }}
        NON_UI_HEAD_COVERAGE: ${{ steps.coverage_delta.outputs.non_ui_head }}
        NON_UI_BASE_COVERAGE: ${{ steps.coverage_delta.outputs.non_ui_base }}
        NON_UI_DELTA_COVERAGE: ${{ steps.coverage_delta.outputs.non_ui_delta }}
      with:
        script: |
          const marker = '<!-- coverage-delta-comment -->';
          const available = (process.env.COVERAGE_AVAILABLE || '').toLowerCase() === 'true';
          const allHead = Number(process.env.ALL_HEAD_COVERAGE || '0');
          const allBase = Number(process.env.ALL_BASE_COVERAGE || '0');
          const allDelta = Number(process.env.ALL_DELTA_COVERAGE || '0');
          const nonUiHead = Number(process.env.NON_UI_HEAD_COVERAGE || '0');
          const nonUiBase = Number(process.env.NON_UI_BASE_COVERAGE || '0');
          const nonUiDelta = Number(process.env.NON_UI_DELTA_COVERAGE || '0');

          const trend = (value) => value > 0 ? 'increased' : (value < 0 ? 'decreased' : 'did not change');

          const body = available
            ? [
                marker,
                '## Test Coverage Delta',
                '',
                '_This comment updates with future commits to this branch and is removed when there are no remaining coverage issues to report._',
                '',
                `All-classes coverage ${trend(allDelta)} compared to \`development\`.`,
                `Non-Swing UI coverage ${trend(nonUiDelta)} compared to \`development\`.`,
                '',
                '| Metric | development | this PR | delta |',
                '|---|---:|---:|---:|',
                `| All classes | ${allBase.toFixed(3)}% | ${allHead.toFixed(3)}% | ${allDelta >= 0 ? '+' : ''}${allDelta.toFixed(3)}% |`,
                `| Non-Swing UI classes | ${nonUiBase.toFixed(3)}% | ${nonUiHead.toFixed(3)}% | ${nonUiDelta >= 0 ? '+' : ''}${nonUiDelta.toFixed(3)}% |`,
              ].join('\n')
            : [
                marker,
                '## Test Coverage Delta',
                '',
                '_This comment updates with future commits to this branch and is removed when there are no remaining coverage issues to report._',
                '',
                'Coverage comparison for all classes and non-Swing UI classes is unavailable for this run because the stored development coverage summary was not available.',
              ].join('\n');

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });

          const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

    - name: Summarize coverage hot spots
      shell: bash
      run: |
        python - <<'PY'
        import csv
        import os
        from pathlib import Path

        csv_path = Path('target/site/jacoco/jacoco.csv')
        ui_prefixes = ('edu.regis.dptu.view',)
        if not csv_path.exists():
          print('JaCoCo CSV not found; skipping summary output.')
          raise SystemExit(0)

        with csv_path.open(newline='', encoding='utf-8') as f:
          rows = list(csv.DictReader(f))

        all_covered = sum(int(r['LINE_COVERED']) for r in rows)
        all_missed = sum(int(r['LINE_MISSED']) for r in rows)
        all_total = all_covered + all_missed
        all_coverage_pct = (100.0 * all_covered / all_total) if all_total else 0.0

        non_ui_rows = [r for r in rows if not r['PACKAGE'].startswith(ui_prefixes)]
        non_ui_covered = sum(int(r['LINE_COVERED']) for r in non_ui_rows)
        non_ui_missed = sum(int(r['LINE_MISSED']) for r in non_ui_rows)
        non_ui_total = non_ui_covered + non_ui_missed
        non_ui_coverage_pct = (100.0 * non_ui_covered / non_ui_total) if non_ui_total else 0.0

        hot_spots = [r for r in rows if int(r['LINE_MISSED']) > 0]
        hot_spots.sort(key=lambda r: int(r['LINE_MISSED']), reverse=True)
        top_ten = hot_spots[:10]

        step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
        if not step_summary:
          raise SystemExit(0)

        with open(step_summary, 'a', encoding='utf-8') as summary:
          summary.write('## Coverage Summary\n')
          summary.write('| Metric | Covered | Missed | Line Coverage |\n')
          summary.write('|---|---:|---:|---:|\n')
          summary.write(f'| JaCoCo (all classes) | {all_covered} | {all_missed} | {all_coverage_pct:.2f}% |\n')
          summary.write(f'| JaCoCo (non-Swing UI classes) | {non_ui_covered} | {non_ui_missed} | {non_ui_coverage_pct:.2f}% |\n')

          summary.write('\n## Top 10 Classes Reducing Coverage\n')
          summary.write('| Class | Missed Lines | Covered Lines | Line Coverage |\n')
          summary.write('|---|---:|---:|---:|\n')

          for r in top_ten:
            class_name = f"{r['PACKAGE']}.{r['CLASS']}"
            cls_missed = int(r['LINE_MISSED'])
            cls_covered = int(r['LINE_COVERED'])
            cls_total = cls_missed + cls_covered
            cls_pct = (100.0 * cls_covered / cls_total) if cls_total else 0.0
            summary.write(
              f"| `{class_name}` | {cls_missed} | {cls_covered} | {cls_pct:.2f}% |\\n"
            )
        PY

    - name: Generate JaCoCo coverage badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: target/site/jacoco/jacoco.csv
        fail-if-coverage-less-than: 40
        badges-directory: .github/badges

    - name: Commit coverage badge (if changed)
      if: github.ref == 'refs/heads/development' # Only commit from development branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/badges/*.svg .github/badges/*.json || true
        git diff --cached --quiet || git commit -m "chore(ci): update coverage badge"
        git push

    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always() && hashFiles('target/surefire-reports/*.xml') != ''
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
