name: Run Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch: #allow manual runs

permissions:
  contents: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17 (with Maven cache)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run tests and generate coverage report
      run: mvn -B verify

    - name: Prepare unit-test coverage CSV (exclude Swing UI packages)
      run: |
        python - <<'PY'
        import csv
        from pathlib import Path

        source = Path('target/site/jacoco/jacoco.csv')
        target = Path('target/site/jacoco/jacoco.unit.csv')

        excluded_prefixes = ('edu.regis.dptu.view', 'edu.regis.dptu.view.act')
        excluded_exact = {'edu.regis.dptu'}

        with source.open(newline='', encoding='utf-8') as src, target.open('w', newline='', encoding='utf-8') as dst:
            reader = csv.DictReader(src)
            writer = csv.DictWriter(dst, fieldnames=reader.fieldnames)
            writer.writeheader()
            for row in reader:
                package_name = row['PACKAGE']
                if package_name in excluded_exact:
                    continue
                if package_name.startswith(excluded_prefixes):
                    continue
                writer.writerow(row)
        PY

    - name: Generate JaCoCo coverage badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: target/site/jacoco/jacoco.unit.csv
        fail-if-coverage-less-than: 40
        badges-directory: .github/badges

    - name: Commit coverage badge (if changed)
      if: github.event_name == 'push' && github.ref == 'refs/heads/development' # Only commit from direct pushes to development
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A .github/badges
        git diff --cached --quiet || git commit -m "chore(ci): update coverage badge"
        git push

    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
