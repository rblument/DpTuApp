name: PR Workflow Failure Comments

# NOTE: GitHub reads the `workflow_run.workflows` list from the DEFAULT BRANCH at dispatch time,
# not from the branch where the triggering event originated. This means:
#   - Changes to the watch list below only take effect after this file is merged to development.
#   - The `validate-watchlist-drift` job (which runs from the PR branch) catches drift early,
#     but the actual watch behavior activates only post-merge.
# There is no GitHub-supported workaround for this constraint.
on:
  workflow_run:
    workflows:
      - Format Build Test
      - Standards Check
      - CodeQL Advanced
      - PR Workflow Failure Comments
    types:
      - completed
  pull_request:
    branches: [ main, development ]
    paths:
      - .github/workflows/*.yml
      - .github/workflows/*.yaml
  push:
    branches: [ main, development ]
    paths:
      - .github/workflows/*.yml
      - .github/workflows/*.yaml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# This workflow contains two independent jobs that share the same file but run
# under different trigger conditions.
#
# Job 1 – validate-watchlist-drift (triggers: pull_request, push, workflow_dispatch)
#   Runs whenever a workflow YAML file changes. Parses the workflow_run.workflows
#   watch list defined in this file, then scans every other workflow file for a
#   pull_request: trigger. Fails if:
#     - Any pull_request-triggered workflow is missing from the watch list
#       (drift: new workflow added but not watched).
#     - Any entry in the watch list no longer matches a known workflow name
#       (stale: workflow renamed or removed).
#   To exclude a workflow from the watch requirement, add this comment anywhere
#   in that workflow file:
#     # pr-workflow-failure-comments: ignore
#
# Job 2 – report-workflow-failures (trigger: workflow_run completed)
#   Fires when any watched workflow finishes. For each PR associated with that
#   run it either posts, updates, or deletes one sticky comment:
#     - Non-success conclusions (failure, timed_out, cancelled, etc.):
#       Upsert a comment listing failed jobs, their failing steps, and up to
#       three first-matching error log lines from the job logs.
#     - Success / other healthy conclusions:
#       Delete any existing failure comment for that workflow so the PR stays
#       clean once the problem is resolved.
#   Each comment is identified by a unique HTML marker:
#     <!-- pr-workflow-failure:{workflow-slug} -->
#   so comments for different workflows never overwrite each other.
#   PR association is resolved from workflow_run.pull_requests; if that list is
#   empty (common for cross-fork runs), the workflow falls back to searching
#   open PRs by head branch name.

jobs:
  validate-watchlist-drift:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate watched workflow list covers pull_request workflows
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          current_workflow = Path('.github/workflows/pr-workflow-failure-comments.yml')
          all_workflow_files = sorted(Path('.github/workflows').glob('*.y*ml'))

          own_text = current_workflow.read_text(encoding='utf-8')

          block_match = re.search(
            r'workflow_run:\s*\n(?:\s{2,}.*\n)*?\s{4}workflows:\s*\n(?P<items>(?:\s{6}-\s.*\n)+)',
            own_text,
          )
          if not block_match:
            raise SystemExit('Unable to parse workflow_run.workflows list from pr-workflow-failure-comments.yml')

          watched = []
          for line in block_match.group('items').splitlines():
            item = line.strip()[2:].strip()
            item = item.strip('"').strip("'")
            if item:
              watched.append(item)

          watched_set = set(watched)

          expected = set()
          known_names = set()

          for wf in all_workflow_files:
            text = wf.read_text(encoding='utf-8')

            if 'pr-workflow-failure-comments: ignore' in text:
              continue

            name_match = re.search(r'^\s*name:\s*["\']?(.+?)["\']?\s*$', text, re.MULTILINE)
            if not name_match:
              continue

            workflow_name = name_match.group(1).strip()
            known_names.add(workflow_name)

            if re.search(r'^\s*pull_request\s*:', text, re.MULTILINE):
              expected.add(workflow_name)

          missing = sorted(expected - watched_set)
          stale = sorted(watched_set - known_names)

          if missing or stale:
            print('Watch list drift detected in .github/workflows/pr-workflow-failure-comments.yml')
            if missing:
              print('\nMissing from workflow_run.workflows (add these names):')
              for item in missing:
                print(f'  - {item}')
            if stale:
              print('\nStale entries in workflow_run.workflows (remove or rename these):')
              for item in stale:
                print(f'  - {item}')
            raise SystemExit(1)

          marker_token = 'pr-workflow-failure:${workflowSlug}'
          if marker_token not in own_text:
            raise SystemExit('Primary workflow marker contract is missing expected token: pr-workflow-failure:${workflowSlug}')

          poller_workflow = Path('.github/workflows/pr-workflow-failure-comments-poller.yml')
          if poller_workflow.exists():
            poller_text = poller_workflow.read_text(encoding='utf-8')

            if marker_token not in poller_text:
              raise SystemExit('Poller workflow marker contract is missing expected token: pr-workflow-failure:${workflowSlug}')

            poller_match = re.search(
              r'const\s+watchedWorkflows\s*=\s*\[(?P<items>.*?)\];',
              poller_text,
              re.DOTALL,
            )

            if not poller_match:
              raise SystemExit('Unable to parse watchedWorkflows list from pr-workflow-failure-comments-poller.yml')

            poller_watched = set(
              name.strip()
              for name in re.findall(r'"([^"]+)"|\'([^\']+)\'', poller_match.group('items'))
              for name in name
              if name.strip()
            )

            primary_watched_for_poller = set(watched_set)
            primary_watched_for_poller.discard('PR Workflow Failure Comments')

            poller_missing = sorted(primary_watched_for_poller - poller_watched)
            poller_stale = sorted(poller_watched - primary_watched_for_poller)

            if poller_missing or poller_stale:
              print('Poller watched workflow list is out of sync with primary watch list.')
              if poller_missing:
                print('\nMissing from poller watchedWorkflows:')
                for item in poller_missing:
                  print(f'  - {item}')
              if poller_stale:
                print('\nStale poller watchedWorkflows entries:')
                for item in poller_stale:
                  print(f'  - {item}')
              raise SystemExit(1)

          print('Watch list is up to date for all pull_request-triggered workflows.')
          PY

  report-workflow-failures:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-workflow-failure-${{ github.repository }}-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true

    steps:
      - name: Upsert or remove PR failure summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const workflowName = workflowRun.name || 'Unknown Workflow';
            const workflowSlug = workflowName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const marker = `<!-- pr-workflow-failure:${workflowSlug} -->`;
            const expectedMarker = `<!-- pr-workflow-failure:${workflowSlug} -->`;

            if (marker !== expectedMarker || !marker.includes('pr-workflow-failure:')) {
              throw new Error('Marker consistency self-check failed.');
            }

            const metrics = {
              commentsCreated: 0,
              commentsUpdated: 0,
              commentsDeleted: 0,
              staleShaSkipped: 0,
              logFallbacks: 0,
              prsWithoutAssociation: 0,
              apiBudgetStops: 0,
            };

            const apiBudget = {
              maxJobsPages: 2,
              maxCommentsPages: 1,
              maxPullsPages: 2,
              pullsPerPage: 50,
            };

            const actionableConclusions = new Set([
              'failure',
              'timed_out',
              'cancelled',
              'action_required',
              'startup_failure',
              'stale',
            ]);

            const toOneLine = (value) => String(value || '').replace(/\s+/g, ' ').trim();
            const formatConclusion = (value) => String(value || 'unknown').replace(/_/g, ' ');

            const findFailExcerpt = (text) => {
              if (!text) {
                return [];
              }

              const lines = text.split(/\r?\n/);
              const maxScanLines = 3000;
              const scanned = lines.slice(Math.max(0, lines.length - maxScanLines));

              const failPatterns = [
                /##\[error\]/i,
                /\berror\b/i,
                /\bexception\b/i,
                /\bfailed\b/i,
                /\bfailure\b/i,
                /\bfatal\b/i,
              ];

              let idx = -1;
              for (let i = 0; i < scanned.length; i++) {
                const line = scanned[i];
                if (failPatterns.some((pattern) => pattern.test(line))) {
                  idx = i;
                  break;
                }
              }

              if (idx === -1) {
                return [];
              }

              const excerpt = [];
              for (let i = idx; i < scanned.length && excerpt.length < 3; i++) {
                const candidate = toOneLine(scanned[i]);
                if (candidate.length > 0) {
                  excerpt.push(candidate.slice(0, 220));
                }
              }
              return excerpt;
            };

            const readJobLogExcerpt = async (jobId) => {
              try {
                const logMeta = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                  owner,
                  repo,
                  job_id: jobId,
                  request: { redirect: 'manual' },
                });

                const downloadUrl = logMeta.headers?.location || logMeta.url;
                if (!downloadUrl) {
                  return { lines: [], reason: 'no_log_download_url' };
                }

                const logResponse = await fetch(downloadUrl);
                if (!logResponse.ok) {
                  return { lines: [], reason: `log_download_http_${logResponse.status}` };
                }

                const logText = await logResponse.text();
                const lines = findFailExcerpt(logText);
                if (lines.length === 0) {
                  return { lines: [], reason: 'no_matching_failure_lines' };
                }
                return { lines, reason: null };
              } catch (error) {
                core.info(`Unable to read logs for job ${jobId}: ${error.message}`);
                return { lines: [], reason: 'log_api_exception' };
              }
            };

            const getTargetPrs = async () => {
              if (Array.isArray(workflowRun.pull_requests) && workflowRun.pull_requests.length > 0) {
                return workflowRun.pull_requests;
              }

              try {
                const headRepo = workflowRun.head_repository?.full_name;
                if (headRepo !== `${owner}/${repo}`) {
                  return [];
                }

                const head = `${owner}:${workflowRun.head_branch}`;
                const pulls = [];
                for (let page = 1; page <= apiBudget.maxPullsPages; page++) {
                  const response = await github.rest.pulls.list({
                    owner,
                    repo,
                    state: 'open',
                    head,
                    per_page: apiBudget.pullsPerPage,
                    page,
                  });

                  pulls.push(...(response.data || []));

                  if ((response.data || []).length < apiBudget.pullsPerPage) {
                    break;
                  }

                  if (page === apiBudget.maxPullsPages) {
                    metrics.apiBudgetStops += 1;
                    core.info('API budget reached while listing fallback PRs. Results may be truncated.');
                  }
                }
                return pulls;
              } catch (error) {
                core.info(`Unable to resolve PRs from head branch fallback: ${error.message}`);
                return [];
              }
            };

            const listJobsForRunLimited = async (runId) => {
              const jobs = [];
              for (let page = 1; page <= apiBudget.maxJobsPages; page++) {
                const response = await github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: runId,
                  per_page: 100,
                  page,
                });

                jobs.push(...(response.data?.jobs || []));

                if ((response.data?.jobs || []).length < 100) {
                  break;
                }

                if (page === apiBudget.maxJobsPages) {
                  metrics.apiBudgetStops += 1;
                  core.info('API budget reached while listing jobs for workflow run. Results may be truncated.');
                }
              }
              return jobs;
            };

            const listIssueCommentsLimited = async (issueNumber) => {
              const comments = [];
              for (let page = 1; page <= apiBudget.maxCommentsPages; page++) {
                const response = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100,
                  page,
                });

                comments.push(...(response.data || []));

                if ((response.data || []).length < 100) {
                  break;
                }

                if (page === apiBudget.maxCommentsPages) {
                  metrics.apiBudgetStops += 1;
                  core.info(`API budget reached while listing comments on PR #${issueNumber}. Results may be truncated.`);
                }
              }
              return comments;
            };

            const runConclusion = (workflowRun.conclusion || 'unknown').toLowerCase();

            const targetPrs = await getTargetPrs();
            if (targetPrs.length === 0) {
              core.info('No pull request is associated with this workflow run. Nothing to do.');
              metrics.prsWithoutAssociation += 1;
              await core.summary
                .addHeading('PR Workflow Failure Observability')
                .addCodeBlock(JSON.stringify(metrics, null, 2), 'json')
                .write();
              return;
            }

            const jobs = await listJobsForRunLimited(workflowRun.id);

            const failingJobConclusions = new Set(['failure', 'timed_out', 'cancelled', 'action_required', 'startup_failure']);
            const failedJobs = jobs.filter((job) => failingJobConclusions.has((job.conclusion || '').toLowerCase()));

            const failedJobDetails = [];
            for (const job of failedJobs.slice(0, 10)) {
              const badSteps = (job.steps || [])
                .filter((step) => ['failure', 'timed_out', 'cancelled', 'action_required'].includes((step.conclusion || '').toLowerCase()))
                .slice(0, 3)
                .map((step) => `${step.name} (${step.conclusion || 'unknown'})`);

              const logResult = await readJobLogExcerpt(job.id);
              if (logResult.reason) {
                metrics.logFallbacks += 1;
              }

              failedJobDetails.push({
                name: job.name,
                url: job.html_url,
                conclusion: formatConclusion(job.conclusion),
                badSteps,
                logExcerpt: logResult.lines,
                logFallbackReason: logResult.reason,
              });
            }

            for (const pr of targetPrs) {
              const issue_number = pr.number;

              const prHead = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issue_number,
              });

              if ((prHead.data.head?.sha || '') !== (workflowRun.head_sha || '')) {
                metrics.staleShaSkipped += 1;
                core.info(`Skipping stale workflow run for PR #${issue_number}: run sha ${workflowRun.head_sha} != current sha ${prHead.data.head?.sha}`);
                continue;
              }

              const comments = await listIssueCommentsLimited(issue_number);

              const existing = comments.find(
                (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
              );

              if (!actionableConclusions.has(runConclusion)) {
                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                  });
                  metrics.commentsDeleted += 1;
                  core.info(`Removed stale failure summary for workflow '${workflowName}' on PR #${issue_number}.`);
                } else {
                  core.info(`Workflow '${workflowName}' is healthy and no stale comment exists on PR #${issue_number}.`);
                }
                continue;
              }

              const lines = [];
              lines.push(marker);
              lines.push(`## Workflow Failure: ${workflowName}`);
              lines.push('');
              lines.push('_This comment is sticky (updated on new runs) and ephemeral (deleted when this workflow is no longer failing)._');
              lines.push('');
              lines.push(`- Workflow conclusion: **${formatConclusion(runConclusion)}**`);
              lines.push(`- Failed jobs: **${failedJobs.length}**`);
              lines.push(`- Run: [#${workflowRun.run_number}.${workflowRun.run_attempt}](${workflowRun.html_url})`);
              lines.push('');

              if (failedJobDetails.length === 0) {
                lines.push('No job-level failure details were returned by the Actions API. Open the run link above for full logs.');
              } else {
                lines.push('### Failed Jobs');
                lines.push('');

                for (const job of failedJobDetails) {
                  lines.push(`- [${job.name}](${job.url}) (**${job.conclusion}**)`);

                  if (job.badSteps.length > 0) {
                    lines.push(`  - Failing steps: ${job.badSteps.join(', ')}`);
                  }

                  if (job.logExcerpt.length > 0) {
                    lines.push('  - First failing log lines:');
                    for (const line of job.logExcerpt) {
                      lines.push(`    - ${line}`);
                    }
                  } else if (job.logFallbackReason) {
                    lines.push(`  - Log excerpt unavailable: ${job.logFallbackReason}`);
                  }
                }

                if (failedJobs.length > 10) {
                  lines.push('');
                  lines.push(`_Showing first 10 failed jobs out of ${failedJobs.length}._`);
                }
              }

              lines.push('');
              lines.push('### Next Steps');
              lines.push('');
              lines.push('1. Open the run link above.');
              lines.push('2. Open each failed job and expand the first failing step.');
              lines.push('3. Push a fix and this comment will update automatically.');

              const body = lines.join('\n').slice(0, 64000);

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                metrics.commentsUpdated += 1;
                core.info(`Updated failure summary for workflow '${workflowName}' on PR #${issue_number}.`);
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
                metrics.commentsCreated += 1;
                core.info(`Posted failure summary for workflow '${workflowName}' on PR #${issue_number}.`);
              }
            }

            await core.summary
              .addHeading('PR Workflow Failure Observability')
              .addCodeBlock(JSON.stringify(metrics, null, 2), 'json')
              .write();