name: Logging Standards Check

permissions:
  contents: read

# This workflow enforces the DpTu Logging Developer Guide.
#
# Goals:
# 1) FAIL the build on forbidden logging patterns that bypass SLF4J
# 2) WARN (non-blocking) on files that appear to have no logging at all
#
# Rationale:
# - Application code must use SLF4J (org.slf4j.Logger) exclusively
# - Direct console output, stack trace printing, JUL imports, or direct
# backend usage (Log4j2) are not allowed in new code
# - Some checks are warnings to avoid breaking legacy code while still
# nudging developers toward the standard

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches: [ main, development ]
  workflow_dispatch: # allow manual runs

jobs:
  logging-standards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # STEP 1: Fail-fast checks for forbidden patterns
      # ------------------------------------------------------------------
      - name: Enforce forbidden logging patterns (ERROR)
        shell: bash
        run: |
          set -euo pipefail

          # Build a concrete list of Java files to scan (non-test sources only).
          # Using an explicit list avoids accidental scanning of resources.
          mapfile -t JAVA_FILES < <(
            find src/ -type f -name '*.java' \
              ! -path '*/test/*' \
              ! -path '*/tests/*' \
              ! -path '*/integrationTest/*' \
              ! -path '*/integrationTests/*' \
              ! -name '*Test.java' \
              ! -name '*Tests.java' \
              ! -name '*IT.java'
          )

          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "ℹ️ No Java source files found to scan."
            exit 0
          fi

          echo "🔍 Enforcing logging standards (errors)..."

          # These patterns indicate logging bypasses or API drift and
          # MUST fail the build if detected anywhere in src/.
          #
          # Notes:
          # - System.out / System.err bypass the logging framework entirely
          # - printStackTrace() loses structure and routing
          # - Direct JUL or Log4j2 usage violates the SLF4J-only rule
          ERROR_PATTERNS=(
            # Console output (stdout)
            "System\\.out\\.(print|println|printf|append)"

            # Console output (stderr)
            "System\\.err\\.(print|println|printf)"

            # Any Throwable/Exception stack trace printing
            "\\.printStackTrace\\s*\\("

            # Direct JUL imports or logger creation
            "import java\\.util\\.logging\\."
            "java\\.util\\.logging\\.Logger\\.getLogger"

            # Direct Log4j / Log4j2 usage in application code
            "import org\\.apache\\.logging\\.log4j"
            "LogManager\\.getLogger"

            # Abrupt JVM termination (bypasses shutdown logging)
            "System\\.exit\\s*\\("
          )

          FAILED=0

          for pattern in "${ERROR_PATTERNS[@]}"; do
            echo "Checking ERROR pattern: $pattern"
            if grep -nE "$pattern" "${JAVA_FILES[@]}"; then
              echo "❌ Forbidden pattern detected: $pattern"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo
            echo "🚨 Logging standards violation found."
            echo "Refer to the DpTu Logging Developer Guide for correct usage."
            exit 1
          fi

          echo "✅ No forbidden logging patterns found."

      # ------------------------------------------------------------------
      # STEP 2: Advisory checks (warnings only)
      # ------------------------------------------------------------------
      - name: Advisory logging checks (WARN)
        shell: bash
        run: |
          set -euo pipefail

          # Build a concrete list of Java files to scan (non-test sources only).
          # Using an explicit list avoids accidental scanning of resources.
          mapfile -t JAVA_FILES < <(
            find src/ -type f -name '*.java' \
              ! -path '*/test/*' \
              ! -path '*/tests/*' \
              ! -path '*/integrationTest/*' \
              ! -path '*/integrationTests/*' \
              ! -name '*Test.java' \
              ! -name '*Tests.java' \
              ! -name '*IT.java'
          )

          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "ℹ️ No Java source files found to scan."
            exit 0
          fi

          echo "⚠️ Running advisory logging checks (warnings only)..."

          # --------------------------------------------------------------
          # SANITY: identify file kinds that generally should not need logging
          # (enums, interfaces, annotations, records). These are exempt from
          # "missing logger" / "unused logger" warnings by default.
          # --------------------------------------------------------------

          # Top-level enum/interface/@interface/record declarations (heuristic: starts at line beginning)
          ENUM_FILES=$(
            grep -lE '^\s*(public\s+)?enum\s+[A-Za-z_][A-Za-z0-9_]*\b' "${JAVA_FILES[@]}" || true
          )
          INTERFACE_FILES=$(
            grep -lE '^\s*(public\s+)?interface\s+[A-Za-z_][A-Za-z0-9_]*\b' "${JAVA_FILES[@]}" || true
          )
          ANNOTATION_FILES=$(
            grep -lE '^\s*(public\s+)?@interface\s+[A-Za-z_][A-Za-z0-9_]*\b' "${JAVA_FILES[@]}" || true
          )
          RECORD_FILES=$(
            grep -lE '^\s*(public\s+)?record\s+[A-Za-z_][A-Za-z0-9_]*\b' "${JAVA_FILES[@]}" || true
          )

          # Union of exempt files (sorted unique)
          EXEMPT_FILES=$(
            { printf "%s\n" $ENUM_FILES $INTERFACE_FILES $ANNOTATION_FILES $RECORD_FILES 2>/dev/null || true; } | \
              sed '/^\s*$/d' | sort -u
          )

          # Files that explicitly suppress logging warnings
          LOGGING_SUPPRESSED_FILES=$(
            grep -l '@SuppressWarnings("Logging")' "${JAVA_FILES[@]}" || true
          )

          # --------------------------------------------------------------
          # SANITY: suppressions should only be used on exempt kinds.
          # If a file suppresses Logging but is NOT exempt, warn on it.
          # --------------------------------------------------------------
          BAD_SUPPRESS_FILES=""
          if [ -n "${LOGGING_SUPPRESSED_FILES:-}" ]; then
            BAD_SUPPRESS_FILES=$(
              comm -23 \
                <(printf "%s\n" $LOGGING_SUPPRESSED_FILES | sort -u) \
                <(printf "%s\n" $EXEMPT_FILES | sort -u) || true
            )
          fi

          # --------------------------------------------------------------
          # WARN 1: Missing or unused SLF4J logging (excluding exempt kinds)
          #
          # Escape hatch:
          #   @SuppressWarnings("Logging")
          #
          # Suppresses WARN-only findings, never ERRORs
          # --------------------------------------------------------------

          # Files with no SLF4J Logger import at all
          NO_LOG_IMPORT_FILES=$(
            grep -LE "org.slf4j.Logger" "${JAVA_FILES[@]}" || true
          )

          # Files that import SLF4J Logger but never use it
          UNUSED_LOGGER_FILES=$(
            grep -l "org.slf4j.Logger" "${JAVA_FILES[@]}" | \
            xargs -r grep -EL "log\.(trace|debug|info|warn|error)\s*\("
          )

          # Helper: remove suppressed files from a list
          filter_suppressed() {
            local files="$1"
            if [ -n "$files" ] && [ -n "${LOGGING_SUPPRESSED_FILES:-}" ]; then
              comm -23 \
                <(printf "%s\n" $files | sort -u) \
                <(printf "%s\n" $LOGGING_SUPPRESSED_FILES | sort -u)
            else
              printf "%s\n" $files | sed '/^\s*$/d' || true
            fi
          }

          # Helper: remove exempt files from a list
          filter_exempt() {
            local files="$1"
            if [ -n "$files" ] && [ -n "${EXEMPT_FILES:-}" ]; then
              comm -23 \
                <(printf "%s\n" $files | sort -u) \
                <(printf "%s\n" $EXEMPT_FILES | sort -u)
            else
              printf "%s\n" $files | sed '/^\s*$/d' || true
            fi
          }

          # Apply filters: first remove suppressed, then remove exempt (or vice versa)
          NO_LOG_IMPORT_FILES=$(filter_exempt "$(filter_suppressed "$NO_LOG_IMPORT_FILES")")
          UNUSED_LOGGER_FILES=$(filter_exempt "$(filter_suppressed "$UNUSED_LOGGER_FILES")")

          if [ -n "$NO_LOG_IMPORT_FILES" ] || [ -n "$UNUSED_LOGGER_FILES" ] || [ -n "$BAD_SUPPRESS_FILES" ]; then
            echo
            echo "⚠️ Advisory logging findings:"

            if [ -n "$NO_LOG_IMPORT_FILES" ]; then
              echo
              echo "--- No SLF4J Logger import detected (non-exempt, non-suppressed) ---"
              echo "$NO_LOG_IMPORT_FILES"
            fi

            if [ -n "$UNUSED_LOGGER_FILES" ]; then
              echo
              echo "--- SLF4J Logger imported but never used (non-exempt, non-suppressed) ---"
              echo "$UNUSED_LOGGER_FILES"
            fi

            if [ -n "$BAD_SUPPRESS_FILES" ]; then
              echo
              echo "--- Suppressed files that do NOT pass sanity checks ---"
              echo "$BAD_SUPPRESS_FILES"
              echo
              echo "Guidance: Only suppress @SuppressWarnings(\"Logging\") on enums/interfaces/annotations/records."
              echo "If a class truly should not log, refactor to an exempt kind or add a short note explaining why and log minimally where behavior exists."
            fi

            echo
            echo "Guidance: Add logging, or suppress only when the file is an exempt kind."
          else
            echo "✅ All Java files appear to use SLF4J logging correctly (with sanity exemptions applied)."
          fi

          # --------------------------------------------------------------
          # WARN 2: Empty catch blocks
          # --------------------------------------------------------------
          if grep -nE "catch\s*\([^)]*\)\s*\{\s*\}" "${JAVA_FILES[@]}"; then
            echo
            echo "⚠️ Empty catch blocks detected. Consider logging the exception."
          else
            echo "✅ No empty catch blocks detected."
          fi

          # --------------------------------------------------------------
          # WARN 3: log.error calls without exception parameter
          # --------------------------------------------------------------
          if grep -nE "log\.error\s*\([^,)]*\)" "${JAVA_FILES[@]}"; then
            echo
            echo "⚠️ log.error calls without exception context detected."
            echo "Guidance: Prefer log.error(\"message\", exception)."
          else
            echo "✅ All log.error calls appear to include exception context."
          fi

          echo
          echo "ℹ️ Advisory checks complete. Warnings do not fail the build."
