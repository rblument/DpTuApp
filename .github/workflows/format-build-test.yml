name: Format Build Test

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  workflow_dispatch: #allow manual runs

permissions:
  contents: write
  checks: write
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout current ref
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

    - name: Intentional failure hook (Format Build Test)
      if: github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'ci:test-fail-format-build-test')
      shell: bash
      run: |
        echo "Intentional failure enabled by PR label: ci:test-fail-format-build-test"
        echo "Remove the label to disable this test hook."
        exit 1

    - name: Set up JDK 17 (with Maven cache)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Apply formatting on same-repository pull requests
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      timeout-minutes: 5
      env:
        MAVEN_OPTS: >-
          -Daether.transport.http.connectTimeout=10000
          -Daether.transport.http.requestTimeout=30000
          -Dmaven.wagon.http.retryHandler.count=2
          -Dmaven.wagon.rto=30000
      run: mvn -B --no-transfer-progress spotless:apply

    - name: Check formatting on fork pull requests
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      timeout-minutes: 5
      env:
        MAVEN_OPTS: >-
          -Daether.transport.http.connectTimeout=10000
          -Daether.transport.http.requestTimeout=30000
          -Dmaven.wagon.http.retryHandler.count=2
          -Dmaven.wagon.rto=30000
      run: mvn -B --no-transfer-progress spotless:check

    - name: Check formatting on push/manual runs
      if: github.event_name != 'pull_request'
      timeout-minutes: 5
      env:
        MAVEN_OPTS: >-
          -Daether.transport.http.connectTimeout=10000
          -Daether.transport.http.requestTimeout=30000
          -Dmaven.wagon.http.retryHandler.count=2
          -Dmaven.wagon.rto=30000
      run: mvn -B --no-transfer-progress spotless:check

    - name: Check for formatting changes
      if: github.event_name == 'pull_request'
      id: verify-changed-files
      shell: bash
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push Spotless changes
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.verify-changed-files.outputs.changed == 'true'
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Auto-format code with Spotless"
        git push origin HEAD:${{ github.head_ref }}

  build:
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout PR branch (same repository)
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.head_ref }}

    - name: Checkout current ref
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
      uses: actions/checkout@v4

    - name: Set up JDK 17 (with Maven cache)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compile project
      timeout-minutes: 10
      env:
        MAVEN_OPTS: >-
          -Daether.transport.http.connectTimeout=10000
          -Daether.transport.http.requestTimeout=30000
          -Dmaven.wagon.http.retryHandler.count=2
          -Dmaven.wagon.rto=30000
      run: mvn -B --no-transfer-progress compile

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout PR branch (same repository)
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.head_ref }}

    - name: Checkout current ref
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
      uses: actions/checkout@v4

    - name: Set up JDK 17 (with Maven cache)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run tests and generate coverage report
      timeout-minutes: 15
      env:
        MAVEN_OPTS: >-
          -Daether.transport.http.connectTimeout=10000
          -Daether.transport.http.requestTimeout=30000
          -Dmaven.wagon.http.retryHandler.count=2
          -Dmaven.wagon.rto=30000
      run: mvn -B --no-transfer-progress test jacoco:report

    - name: Generate coverage summary snapshot
      shell: bash
      run: |
        python - <<'PY'
        import csv
        import json
        from pathlib import Path

        csv_path = Path('target/site/jacoco/jacoco.csv')
        output_path = Path('.github/badges/coverage-summary.json')
        ui_prefixes = ('edu.regis.dptu.view',)

        if not csv_path.exists():
          raise SystemExit('JaCoCo CSV not found; cannot generate coverage summary snapshot.')

        with csv_path.open(newline='', encoding='utf-8') as f:
          rows = list(csv.DictReader(f))

        def totals(include_ui: bool) -> tuple[int, int]:
          covered = 0
          missed = 0
          for row in rows:
            package_name = row['PACKAGE']
            if not include_ui and package_name.startswith(ui_prefixes):
              continue
            covered += int(row['LINE_COVERED'])
            missed += int(row['LINE_MISSED'])
          return covered, missed

        def percent(covered: int, missed: int) -> float:
          total = covered + missed
          return (100.0 * covered / total) if total else 0.0

        all_covered, all_missed = totals(include_ui=True)
        non_ui_covered, non_ui_missed = totals(include_ui=False)

        output_path.parent.mkdir(parents=True, exist_ok=True)
        with output_path.open('w', encoding='utf-8') as f:
          json.dump(
            {
              'all_classes': {
                'covered': all_covered,
                'missed': all_missed,
                'percent': round(percent(all_covered, all_missed), 3),
              },
              'non_swing_ui_classes': {
                'covered': non_ui_covered,
                'missed': non_ui_missed,
                'percent': round(percent(non_ui_covered, non_ui_missed), 3),
              },
            },
            f,
            indent=2,
          )
          f.write('\n')
        PY

    - name: Load coverage summary metrics
      if: always() && github.event_name == 'pull_request'
      id: coverage_metrics
      shell: bash
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        summary_path = Path('.github/badges/coverage-summary.json')

        output_path = Path(os.environ['GITHUB_OUTPUT'])

        if not summary_path.exists():
          with output_path.open('a', encoding='utf-8') as out:
            out.write('available=false\n')
            out.write('all_covered=0\n')
            out.write('all_missed=0\n')
            out.write('all_percent=0.000\n')
            out.write('non_ui_covered=0\n')
            out.write('non_ui_missed=0\n')
            out.write('non_ui_percent=0.000\n')

          step_summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary_path:
            with open(step_summary_path, 'a', encoding='utf-8') as summary:
              summary.write('\n## Unit Test Coverage Summary\n')
              summary.write('Coverage summary is unavailable because JaCoCo output was not generated for this run.\n')
          raise SystemExit(0)

        with summary_path.open(encoding='utf-8') as f:
          summary_data = json.load(f)

        all_data = summary_data.get('all_classes', {})
        non_ui_data = summary_data.get('non_swing_ui_classes', {})

        all_covered = int(all_data.get('covered', 0))
        all_missed = int(all_data.get('missed', 0))
        all_percent = float(all_data.get('percent', 0.0))

        non_ui_covered = int(non_ui_data.get('covered', 0))
        non_ui_missed = int(non_ui_data.get('missed', 0))
        non_ui_percent = float(non_ui_data.get('percent', 0.0))

        with output_path.open('a', encoding='utf-8') as out:
          out.write('available=true\n')
          out.write(f'all_covered={all_covered}\n')
          out.write(f'all_missed={all_missed}\n')
          out.write(f'all_percent={all_percent:.3f}\n')
          out.write(f'non_ui_covered={non_ui_covered}\n')
          out.write(f'non_ui_missed={non_ui_missed}\n')
          out.write(f'non_ui_percent={non_ui_percent:.3f}\n')

        step_summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
        if step_summary_path:
          with open(step_summary_path, 'a', encoding='utf-8') as summary:
            summary.write('\n## Unit Test Coverage Summary\n')
            summary.write('| Metric | Covered Lines | Missed Lines | Coverage |\n')
            summary.write('|---|---:|---:|---:|\n')
            summary.write(f'| All classes | {all_covered} | {all_missed} | {all_percent:.3f}% |\n')
            summary.write(f'| Non-Swing UI classes | {non_ui_covered} | {non_ui_missed} | {non_ui_percent:.3f}% |\n')
        PY

    - name: Comment unit test coverage on PR
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        COVERAGE_AVAILABLE: ${{ steps.coverage_metrics.outputs.available }}
        ALL_COVERED_LINES: ${{ steps.coverage_metrics.outputs.all_covered }}
        ALL_MISSED_LINES: ${{ steps.coverage_metrics.outputs.all_missed }}
        ALL_COVERAGE_PCT: ${{ steps.coverage_metrics.outputs.all_percent }}
        NON_UI_COVERED_LINES: ${{ steps.coverage_metrics.outputs.non_ui_covered }}
        NON_UI_MISSED_LINES: ${{ steps.coverage_metrics.outputs.non_ui_missed }}
        NON_UI_COVERAGE_PCT: ${{ steps.coverage_metrics.outputs.non_ui_percent }}
      with:
        script: |
          const marker = '<!-- coverage-summary-comment -->';
          const issue_number = context.issue.number;

          const available = (process.env.COVERAGE_AVAILABLE || '').toLowerCase() === 'true';
          const allCovered = Number(process.env.ALL_COVERED_LINES || '0');
          const allMissed = Number(process.env.ALL_MISSED_LINES || '0');
          const allCoveragePct = Number(process.env.ALL_COVERAGE_PCT || '0');
          const nonUiCovered = Number(process.env.NON_UI_COVERED_LINES || '0');
          const nonUiMissed = Number(process.env.NON_UI_MISSED_LINES || '0');
          const nonUiCoveragePct = Number(process.env.NON_UI_COVERAGE_PCT || '0');

          const body = available
            ? [
                marker,
                '## Unit Test Coverage Summary',
                '',
                '_This comment updates with future commits to this branch._',
                '',
                '| Metric | Covered Lines | Missed Lines | Coverage |',
                '|---|---:|---:|---:|',
                `| All classes | ${allCovered} | ${allMissed} | ${allCoveragePct.toFixed(3)}% |`,
                `| Non-Swing UI classes | ${nonUiCovered} | ${nonUiMissed} | ${nonUiCoveragePct.toFixed(3)}% |`,
              ].join('\n')
            : [
                marker,
                '## Unit Test Coverage Summary',
                '',
                '_This comment updates with future commits to this branch._',
                '',
                'Coverage summary for all classes and non-Swing UI classes is unavailable for this run because JaCoCo output was not generated.',
              ].join('\n');

          const { owner, repo } = context.repo;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });

          const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

    - name: Summarize coverage hot spots
      shell: bash
      run: |
        python - <<'PY'
        import csv
        import os
        from pathlib import Path

        csv_path = Path('target/site/jacoco/jacoco.csv')
        ui_prefixes = ('edu.regis.dptu.view',)
        if not csv_path.exists():
          print('JaCoCo CSV not found; skipping summary output.')
          raise SystemExit(0)

        with csv_path.open(newline='', encoding='utf-8') as f:
          rows = list(csv.DictReader(f))

        all_covered = sum(int(r['LINE_COVERED']) for r in rows)
        all_missed = sum(int(r['LINE_MISSED']) for r in rows)
        all_total = all_covered + all_missed
        all_coverage_pct = (100.0 * all_covered / all_total) if all_total else 0.0

        non_ui_rows = [r for r in rows if not r['PACKAGE'].startswith(ui_prefixes)]
        non_ui_covered = sum(int(r['LINE_COVERED']) for r in non_ui_rows)
        non_ui_missed = sum(int(r['LINE_MISSED']) for r in non_ui_rows)
        non_ui_total = non_ui_covered + non_ui_missed
        non_ui_coverage_pct = (100.0 * non_ui_covered / non_ui_total) if non_ui_total else 0.0

        hot_spots = [r for r in rows if int(r['LINE_MISSED']) > 0]
        hot_spots.sort(key=lambda r: int(r['LINE_MISSED']), reverse=True)
        top_ten = hot_spots[:10]

        step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
        if not step_summary:
          raise SystemExit(0)

        with open(step_summary, 'a', encoding='utf-8') as summary:
          summary.write('## Coverage Summary\n')
          summary.write('| Metric | Covered | Missed | Line Coverage |\n')
          summary.write('|---|---:|---:|---:|\n')
          summary.write(f'| JaCoCo (all classes) | {all_covered} | {all_missed} | {all_coverage_pct:.2f}% |\n')
          summary.write(f'| JaCoCo (non-Swing UI classes) | {non_ui_covered} | {non_ui_missed} | {non_ui_coverage_pct:.2f}% |\n')

          summary.write('\n## Top 10 Classes Reducing Coverage\n')
          summary.write('| Class | Missed Lines | Covered Lines | Line Coverage |\n')
          summary.write('|---|---:|---:|---:|\n')

          for r in top_ten:
            class_name = f"{r['PACKAGE']}.{r['CLASS']}"
            cls_missed = int(r['LINE_MISSED'])
            cls_covered = int(r['LINE_COVERED'])
            cls_total = cls_missed + cls_covered
            cls_pct = (100.0 * cls_covered / cls_total) if cls_total else 0.0
            summary.write(
              f"| `{class_name}` | {cls_missed} | {cls_covered} | {cls_pct:.2f}% |\\n"
            )
        PY

    - name: Generate JaCoCo coverage badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: target/site/jacoco/jacoco.csv
        badges-directory: .github/badges

    - name: Commit coverage badge (if branch is writable)
      if: github.event_name == 'push' && github.ref == 'refs/heads/development' && !github.ref_protected
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/badges/*.svg .github/badges/*.json || true
        git diff --cached --quiet || git commit -m "chore(ci): update coverage badge"
        git push

    - name: Note skipped badge commit on protected branch
      if: github.event_name == 'push' && github.ref == 'refs/heads/development' && github.ref_protected
      run: |
        echo "Branch is protected; skipping automatic badge commit to respect branch protection rules." >> "$GITHUB_STEP_SUMMARY"

    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always() && hashFiles('target/surefire-reports/*.xml') != ''
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
