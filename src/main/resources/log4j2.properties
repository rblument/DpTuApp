status = warn
name = DpTuLoggingConfig

# ---- Properties ----------------------------------------------------
property.APP_NAME = dptu
property.LOG_DIR = ${sys:user.home}/.${APP_NAME}/logs
property.ROOT_LEVEL = ${sys:LOG_LEVEL:-INFO}
property.PAT_CONSOLE = %d{HH:mm:ss.SSS} %-5p [%t] %c{1.} - %m%n
property.PAT_FILE = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p %c{1.} - %m%n

# ---- Console Appender ----------------------------------------------
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${PAT_CONSOLE}

# ---- Rolling File Appender -----------------------------------------
appender.file.type = RollingFile
appender.file.name = File
appender.file.fileName = ${LOG_DIR}/${APP_NAME}.log
appender.file.filePattern = ${LOG_DIR}/archive/${APP_NAME}-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${PAT_FILE}

appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10 MB

appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 14

# ---- Root Logger ----------------------------------------------------
rootLogger.level = ${ROOT_LEVEL}
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File
